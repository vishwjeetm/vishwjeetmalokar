<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ogAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Border accent -->
  <rect x="20" y="20" width="1160" height="590" rx="20" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Logo & Name -->
  <g transform="translate(80, 100)">
    <rect width="56" height="56" rx="14" fill="#2563eb"/>
    <text x="28" y="37" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#fff" text-anchor="middle">&gt;_</text>
    <text x="75" y="40" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="#f8fafc">Vishwjeet</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(80, 210)">
    <rect width="530" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="20" y="23" font-family="monospace" font-size="14" font-weight="700" fill="#38bdf8">FULL-STACK DEVELOPER • AI APPLICATIONS • GEO SOLUTIONS</text>
  </g>

  <!-- Big Hero Headline -->
  <g transform="translate(80, 290)">
    <text font-family="system-ui, sans-serif" font-size="46" font-weight="900" fill="#ffffff" line-height="1.2">
      <tspan x="0" y="0">I Build Web Applications,</tspan>
      <tspan x="0" y="58" fill="url(#ogAccent)">Business Software &amp; AI-Powered</tspan>
      <tspan x="0" y="116">Digital Solutions.</tspan>
    </text>
  </g>

  <!-- Tech row -->
  <g transform="translate(80, 480)">
    <text x="0" y="0" font-family="monospace" font-size="16" fill="#94a3b8">React • Node.js • ASP.NET Core • VB.NET • PostgreSQL • Python • Docker • GEO</text>
  </g>

  <!-- Bottom status -->
  <g transform="translate(80, 530)">
    <circle cx="8" cy="8" r="6" fill="#10b981"/>
    <text x="24" y="13" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#34d399">Available for Freelance Opportunities &amp; Development Contracts</text>
  </g>

  <!-- Domain link -->
  <g transform="translate(980, 535)">
    <text x="0" y="10" font-family="monospace" font-size="16" font-weight="700" fill="#60a5fa">vishwjeet.dev</text>
  </g>
</svg>
