<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Grid lines background -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="375" x2="1200" y2="375"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Top App Bar -->
  <rect x="30" y="25" width="1140" height="60" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <circle cx="65" cy="55" r="14" fill="#3b82f6"/>
  <text x="65" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">GEO</text>
  <text x="95" y="60" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">GEO Auditor <tspan font-weight="400" font-size="14" fill="#94a3b8">— Generative Search Visibility Console</tspan></text>

  <!-- Provider Badges -->
  <g transform="translate(680, 42)">
    <rect width="105" height="26" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10b981"/>
    <text x="24" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">ChatGPT-4o</text>
    
    <g transform="translate(115, 0)">
      <rect width="100" height="26" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#10b981"/>
      <text x="24" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Claude 3.5</text>
    </g>
    
    <g transform="translate(225, 0)">
      <rect width="100" height="26" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#10b981"/>
      <text x="24" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Perplexity</text>
    </g>

    <g transform="translate(335, 0)">
      <rect width="90" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#10b981"/>
      <text x="24" y="17" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Gemini 1.5</text>
    </g>
  </g>

  <!-- KPI Metrics Cards Row -->
  <g transform="translate(30, 105)">
    <!-- KPI 1 -->
    <rect width="265" height="95" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">OVERALL AI VISIBILITY SHARE</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#38bdf8">74.2%</text>
    <text x="145" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981">▲ +8.4% vs 30d</text>

    <!-- KPI 2 -->
    <g transform="translate(290, 0)">
      <rect width="265" height="95" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">SOURCE CITATIONS INDEXED</text>
      <text x="20" y="68" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#a78bfa">1,284</text>
      <text x="145" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Across 86 Domains</text>
    </g>

    <!-- KPI 3 -->
    <g transform="translate(580, 0)">
      <rect width="265" height="95" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">AUDITED PROMPTS RUN</text>
      <text x="20" y="68" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#34d399">420</text>
      <text x="145" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">14 Categories</text>
    </g>

    <!-- KPI 4 -->
    <g transform="translate(870, 0)">
      <rect width="270" height="95" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">AI SENTIMENT SCORE</text>
      <text x="20" y="68" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#facc15">8.6<tspan font-size="18" fill="#94a3b8">/10</tspan></text>
      <text x="135" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981">88% Favorable</text>
    </g>
  </g>

  <!-- Main Left: Multi-Provider Brand Share Chart -->
  <g transform="translate(30, 220)">
    <rect width="720" height="425" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    
    <text x="25" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Brand Share-of-Voice vs Top Competitors</text>
    <text x="25" y="60" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Benchmark across generative AI prompts evaluated in last scheduled audit</text>

    <!-- Legend -->
    <g transform="translate(420, 26)">
      <circle cx="10" cy="10" r="5" fill="#3b82f6"/>
      <text x="22" y="14" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">Target Brand</text>
      <circle cx="120" cy="10" r="5" fill="#ef4444"/>
      <text x="132" y="14" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">Competitor A</text>
      <circle cx="230" cy="10" r="5" fill="#64748b"/>
      <text x="242" y="14" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">Competitor B</text>
    </g>

    <!-- Chart Grid -->
    <g transform="translate(40, 85)" opacity="0.3" stroke="#475569" stroke-dasharray="3 3">
      <line x1="0" y1="50" x2="640" y2="50"/>
      <line x1="0" y1="120" x2="640" y2="120"/>
      <line x1="0" y1="190" x2="640" y2="190"/>
      <line x1="0" y1="260" x2="640" y2="260"/>
    </g>

    <!-- Chart Trend Lines -->
    <g transform="translate(40, 85)">
      <!-- Competitor B line -->
      <path d="M 20 230 Q 140 220, 240 210 T 440 220 T 620 200" fill="none" stroke="#64748b" stroke-width="2.5" opacity="0.8"/>
      <!-- Competitor A line -->
      <path d="M 20 180 Q 140 160, 240 170 T 440 140 T 620 150" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.9"/>
      <!-- Target Brand Primary line with gradient area -->
      <path d="M 20 150 Q 140 120, 240 90 T 440 60 T 620 40 L 620 280 L 20 280 Z" fill="url(#accentGlow)"/>
      <path d="M 20 150 Q 140 120, 240 90 T 440 60 T 620 40" fill="none" stroke="url(#blueViolet)" stroke-width="4"/>

      <!-- Data Dots -->
      <circle cx="20" cy="150" r="5" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
      <circle cx="240" cy="90" r="5" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
      <circle cx="440" cy="60" r="5" fill="#8b5cf6" stroke="#fff" stroke-width="2"/>
      <circle cx="620" cy="40" r="6" fill="#38bdf8" stroke="#fff" stroke-width="2"/>

      <!-- X-axis Labels -->
      <text x="20" y="305" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Week 1</text>
      <text x="170" y="305" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Week 2</text>
      <text x="320" y="305" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Week 3</text>
      <text x="470" y="305" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Week 4</text>
      <text x="620" y="305" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8" font-weight="700" text-anchor="middle">Current Run</text>
    </g>
  </g>

  <!-- Right: Top Citations & LLM Recommendation Breakdown -->
  <g transform="translate(770, 220)">
    <rect width="400" height="425" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    
    <text x="25" y="38" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Top Extracted Citations</text>
    <text x="25" y="60" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Highest authority sources cited in answers</text>

    <!-- Source Item 1 -->
    <g transform="translate(25, 85)">
      <rect width="350" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">G2 Enterprise Software Review</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">g2.com/products/brand/reviews</text>
      <rect x="260" y="16" width="75" height="22" rx="4" fill="#065f46"/>
      <text x="297" y="31" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">38 Cites</text>
    </g>

    <!-- Source Item 2 -->
    <g transform="translate(25, 160)">
      <rect width="350" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">TechCrunch Product Spotlight</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">techcrunch.com/features/enterprise-ai</text>
      <rect x="260" y="16" width="75" height="22" rx="4" fill="#065f46"/>
      <text x="297" y="31" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">24 Cites</text>
    </g>

    <!-- Source Item 3 -->
    <g transform="translate(25, 235)">
      <rect width="350" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#facc15">GitHub Official Documentation</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">docs.domain.com/architecture</text>
      <rect x="260" y="16" width="75" height="22" rx="4" fill="#065f46"/>
      <text x="297" y="31" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">19 Cites</text>
    </g>

    <!-- Footer Notice within Mockup -->
    <g transform="translate(25, 315)">
      <rect width="350" height="85" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">ENGINE OPTIMIZATION RECOMMENDATION</text>
      <text x="15" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">“Increase technical FAQ schema and authoritative citations</text>
      <text x="15" y="62" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">to capture ChatGPT-4o feature comparison queries.”</text>
    </g>
  </g>
</svg>
