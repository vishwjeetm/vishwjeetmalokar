<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="cvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGradCV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" fill="url(#cvBg)"/>

  <text x="50" y="55" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Computer Vision Driving License Authentication Pipeline</text>
  <text x="50" y="80" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Image ingestion, boundary localization, perspective correction, Flask API &amp; MySQL persistence</text>

  <!-- Step 1: Upload & Preprocess -->
  <g transform="translate(50, 120)">
    <rect width="200" height="240" rx="10" fill="url(#cardGradCV)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="20" y="20" width="160" height="85" rx="6" fill="#0f172a" stroke="#334155" stroke-dasharray="3 3"/>
    <text x="100" y="65" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Input ID Image</text>
    <text x="20" y="135" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">1. Ingestion</text>
    <text x="20" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Grayscale transform</text>
    <text x="20" y="180" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Gaussian blur filter</text>
    <text x="20" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Otsu thresholding</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(255, 230)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="35, -4 43, 0 35, 4" fill="#38bdf8"/>
  </g>

  <!-- Step 2: Contour & Edge Detection -->
  <g transform="translate(300, 120)">
    <rect width="200" height="240" rx="10" fill="url(#cardGradCV)" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="20" y="20" width="160" height="85" rx="6" fill="#0f172a" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="35" y="35" width="130" height="55" rx="4" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="100" y="100" font-family="monospace" font-size="9" fill="#34d399" text-anchor="middle">Contour Box</text>
    <text x="20" y="135" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">2. Card Boundary</text>
    <text x="20" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Canny edge operator</text>
    <text x="20" y="180" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• 4-point contour find</text>
    <text x="20" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Perspective warp</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(505, 230)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#818cf8" stroke-width="2"/>
    <polygon points="35, -4 43, 0 35, 4" fill="#818cf8"/>
  </g>

  <!-- Step 3: Verification & Flask Service -->
  <g transform="translate(550, 120)">
    <rect width="200" height="240" rx="10" fill="url(#cardGradCV)" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="20" y="20" width="160" height="85" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="100" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">Flask REST API</text>
    <text x="100" y="75" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">/api/verify (200 OK)</text>
    <text x="20" y="135" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">3. Authentication</text>
    <text x="20" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Key-region extraction</text>
    <text x="20" y="180" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Format validation</text>
    <text x="20" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Tamper anomaly checks</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(755, 230)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#a78bfa" stroke-width="2"/>
    <polygon points="35, -4 43, 0 35, 4" fill="#a78bfa"/>
  </g>

  <!-- Step 4: Storage & Audit Trail -->
  <g transform="translate(800, 120)">
    <rect width="150" height="240" rx="10" fill="url(#cardGradCV)" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="75" cy="60" r="28" fill="#064e3b"/>
    <text x="75" y="66" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">SQL</text>
    <text x="15" y="135" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">4. Storage</text>
    <text x="15" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• SQLAlchemy ORM</text>
    <text x="15" y="180" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• MySQL tables</text>
    <text x="15" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Audit log trail</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(50, 390)">
    <rect width="900" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Prototype Implementation Boundary Notice</text>
    <text x="25" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Engineered as an end-to-end prototype validating document detection mechanics, RESTful microservice response formatting,</text>
    <text x="25" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">and relational logging in MySQL without storing sensitive personal identification data.</text>
  </g>
</svg>
