      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">120 Prompts • Active Daily</text>
    </g>

    <!-- Collection 2 -->
    <g transform="translate(15, 135)">
      <rect width="250" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Brand vs Rival Comparison</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">85 Prompts • Weekly Run</text>
    </g>

    <!-- Collection 3 -->
    <g transform="translate(15, 210)">
      <rect width="250" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Feature Pricing Inquiries</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">64 Prompts • On Demand</text>
