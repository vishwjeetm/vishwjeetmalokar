      <rect width="760" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="25" cy="35" r="8" fill="#10b981"/>
      <text x="45" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Recurring Weekly Audit Active</text>
      <text x="45" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">PostgreSQL and MinIO storing responses, token logs, sentiment breakdown, and source attribution.</text>
    </g>
