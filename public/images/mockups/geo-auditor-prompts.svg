      </g>
      <g transform="translate(410, 48)">
        <rect width="110" height="26" rx="4" fill="#065f46"/>
        <text x="465" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">Gemini: CITED #1</text>
      </g>
    </g>

    <!-- Row 2 -->
    <g transform="translate(30, 175)">
      <rect width="760" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="28" font-family="monospace" font-size="13" font-weight="600" fill="#38bdf8">“Best SAP Business One add-on for shop floor batch release requests and COA?”</text>
      
      <g transform="translate(20, 48)">
