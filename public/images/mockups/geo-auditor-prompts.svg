  <text x="65" y="68" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Prompt Collections &amp; Audit Execution Matrix</text>
  <rect x="940" y="47" width="190" height="32" rx="6" fill="#2563eb"/>
  <text x="1035" y="68" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">+ New Audit Run</text>

