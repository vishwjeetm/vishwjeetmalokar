    <g transform="translate(15, 285)">
      <rect width="250" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">Alternative Tools &amp; Migrations</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">45 Prompts • On Demand</text>
