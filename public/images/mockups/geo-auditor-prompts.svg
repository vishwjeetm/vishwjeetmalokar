        <text x="332" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">Perplexity: HIGH RELEVANCE</text>
      </g>
      <g transform="translate(410, 48)">
        <rect width="110" height="26" rx="4" fill="#065f46"/>
        <text x="465" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">Gemini: FAVORED</text>
