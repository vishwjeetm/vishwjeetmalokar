        <text x="55" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">ChatGPT: CITED #1</text>
      </g>
      <g transform="translate(145, 48)">
        <rect width="110" height="26" rx="4" fill="#065f46"/>
        <text x="200" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">Claude: CITED #1</text>
      </g>
      <g transform="translate(270, 48)">
        <rect width="125" height="26" rx="4" fill="#065f46"/>
        <text x="332" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">Perplexity: CITED #1</text>
      </g>
      <g transform="translate(410, 48)">
        <rect width="110" height="26" rx="4" fill="#065f46"/>
        <text x="465" y="65" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">Gemini: CITED #2</text>
      </g>
    </g>

